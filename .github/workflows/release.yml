name: Build & Release IPA

on:
  push:
    branches: [main]
    # Doc-only changes should not cut a new release.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PROJECT: VOFA2Remote.xcodeproj
      SCHEME: VOFA2Remote
      APP_NAME: VOFA2Remote
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macOS 14 runners were retired on 2026-11-02; macos-15 ships Xcode 16,
      # which can open our objectVersion 77 project.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning:|BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            echo "::error::xcodebuild failed"
            tail -n 60 xcodebuild.log
            exit 1
          fi

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP"
          mkdir -p dist payload/Payload
          cp -R "$APP" payload/Payload/
          ( cd payload && zip -qry "../dist/$APP_NAME-$VERSION-unsigned.ipa" Payload )
          unzip -l "dist/$APP_NAME-$VERSION-unsigned.ipa" | head -n 12
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          lipo -archs "$APP/$APP_NAME"
          echo "ipa=$(du -h "dist/$APP_NAME-$VERSION-unsigned.ipa" | cut -f1)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: dist/*.ipa
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} · ${{ steps.vars.outputs.sha }}
          fail_on_unmatched_files: true
          files: dist/*.ipa
          body: |
            自动构建的未签名 IPA，可用 TrollStore 直接安装。

            - 版本：`${{ env.VERSION }}`（build `${{ github.run_number }}`）
            - 提交：`${{ github.sha }}`
            - 最低系统：iOS 14.0
            - 架构：arm64

            安装：TrollStore → `Install IPA File` → 选择本页附件。
            需要 Apple 开发者证书的话请自行重签，这个包没有签名。
